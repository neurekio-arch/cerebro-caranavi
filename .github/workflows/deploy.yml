name: Desplegar Quartz a GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  administration: write
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment: github-pages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/deploy-pages@v4
